<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F0E6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2B2624" />
    <title>Fetch Media</title>
    <style>
      :root {
        color-scheme: light dark;
        /* Paleta del proyecto (IDEA.md), en sincronía con app/assets/css/tailwind.css */
        --bg: #f5f0e6;
        --bg-deep: #efe7d8;
        --panel: rgb(251 248 241 / 0.86);
        --border: rgb(74 53 37 / 0.14);
        --shadow: rgb(74 53 37 / 0.16);
        --text: #4a3525;
        --muted: #886446;
        --accent: #ff8f30;
        --accent-soft: rgb(255 143 48 / 0.16);
        --grid: rgb(74 53 37 / 0.05);
        --track: rgb(74 53 37 / 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2624;
          --bg-deep: #221e1c;
          --panel: rgb(64 57 53 / 0.78);
          --border: rgb(230 223 213 / 0.14);
          --shadow: rgb(0 0 0 / 0.45);
          --text: #e6dfd5;
          --muted: #b0a79c;
          --accent: #f2b134;
          --accent-soft: rgb(242 177 52 / 0.14);
          --grid: rgb(230 223 213 / 0.045);
          --track: rgb(230 223 213 / 0.16);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 1rem;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: var(--text);
        user-select: none;
        font-family:
          'Noto Sans',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background:
          radial-gradient(circle at 12% -6%, var(--accent-soft), transparent 32%),
          linear-gradient(180deg, var(--bg-deep), var(--bg));
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 2rem 2rem;
        opacity: 0.9;
      }

      .loading-card {
        /* Sin min-width: a 390 px el mínimo de 400 px hacía que la tarjeta se saliera
           de la pantalla. El ancho lo resuelve el width() de abajo. */
        width: min(100%, 29rem);
        position: relative;
        padding: 1.65rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--panel);
        box-shadow: 0 1rem 2.5rem var(--shadow);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.95rem;
      }

      .brand img {
        width: 4.2rem;
        height: 4.2rem;
        flex: none;
        display: block;
        object-fit: contain;
        filter: drop-shadow(0 0.6rem 1.1rem var(--shadow));
      }

      .brand-copy {
        min-width: 0;
      }

      .label {
        margin: 0;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0.35rem 0 0;
        font-size: 1.6rem;
        line-height: 1.15;
        letter-spacing: -0.01em;
        font-weight: 600;
        font-family: Fraunces, ui-serif, Georgia, 'Times New Roman', serif;
      }

      .description {
        margin: 1rem 0 0;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.55;
      }

      .loader {
        margin-top: 1.2rem;
        height: 0.32rem;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }

      .loader::before {
        content: '';
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: slide 1.35s ease-in-out infinite;
      }

      .hint {
        margin: 0.95rem 0 0;
        font-size: 0.82rem;
        color: var(--muted);
      }

      @keyframes slide {
        0% {
          transform: translateX(-130%);
        }

        100% {
          transform: translateX(330%);
        }
      }

      @media (max-width: 560px) {
        body {
          padding-top: calc(1rem + env(safe-area-inset-top));
          padding-bottom: calc(1rem + env(safe-area-inset-bottom));
        }

        .loading-card {
          padding: 1.3rem;
          transform: translateY(clamp(-2.75rem, -7vh, -1.5rem));
        }

        .brand {
          align-items: flex-start;
        }

        h1 {
          font-size: 1.35rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="loading-card" role="status" aria-live="polite" aria-busy="true">
      <div class="brand">
        <picture>
          <source srcset="/images/hero-night.png" media="(prefers-color-scheme: dark)" />
          <img src="/images/hero-day.png" alt="" aria-hidden="true" />
        </picture>

        <div class="brand-copy">
          <p class="label">Fetch Media</p>
          <h1>Loading App</h1>
        </div>
      </div>

      <p class="description">Getting the UI ready.</p>

      <div class="loader" aria-hidden="true"></div>
      <p class="hint">Please wait...</p>
    </main>
  </body>
</html>
